
name: Build C++ EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile C++ to EXE
        shell: cmd
        run: |
          g++ main.cpp -o main.exe -static -O2

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Cpp-Windows-EXE
          path: main.exe
